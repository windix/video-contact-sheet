---

# Tags and publishes a GitHub release when a new version lands on master.
#
# A version is released when dist/vcs has RELEASE=1 and there is no v$VERSION
# tag yet. The release notes are the version's dist/CHANGELOG entry plus
# .github/release/install.md.
# On pull requests nothing is published: the notes are previewed in the job
# summary and the job fails if a releasable version has no CHANGELOG entry.

name: Release

on:
  push:
    branches: [master]
    paths:
      - dist/vcs
      - dist/CHANGELOG
      - .github/release/**
      - .github/workflows/release.yml
  pull_request:
    paths:
      - dist/vcs
      - dist/CHANGELOG
      - .github/release/**
      - .github/workflows/release.yml
  workflow_dispatch: # will allow running manually

permissions:
  contents: read

# Never run two releases at once
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags are needed to tell if the version was released

      - name: Detect version
        id: version
        run: |
          version=$(sed -n 's/^declare -r VERSION="\(.*\)"$/\1/p' dist/vcs)
          release=$(sed -n 's/^declare -r RELEASE=\(.*\)$/\1/p' dist/vcs)
          test -n "$version" || { echo "::error::VERSION not found in dist/vcs" ; exit 1 ; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ $release != 1 ]]; then
            echo "Version $version is a pre-release (RELEASE=$release), nothing to release"
            echo "release=false" >> "$GITHUB_OUTPUT"
          elif git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "v$version is already tagged, nothing to release"
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "v$version will be released"
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate release notes
        if: steps.version.outputs.release == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          .github/release/release-notes.sh "$VERSION" > "$RUNNER_TEMP/notes.md"
          {
            echo "# Release notes for v$VERSION"
            echo
            cat "$RUNNER_TEMP/notes.md"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Tag and publish release
        if: >-
          steps.version.outputs.release == 'true'
          && github.event_name != 'pull_request'
          && github.ref == 'refs/heads/master'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "vcs $VERSION" "$GITHUB_SHA"
          git push origin "v$VERSION"
          gh release create "v$VERSION" --verify-tag --latest \
            --title "vcs $VERSION" --notes-file "$RUNNER_TEMP/notes.md"
